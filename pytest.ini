# =============================================================================
# Pytest Configuration File
# =============================================================================
# This file provides additional pytest configuration beyond pyproject.toml.
# For most settings, see [tool.pytest.ini_options] in pyproject.toml
# This file is maintained for compatibility and pytest-specific features.

[pytest]
# Minimum pytest version required
minversion = 8.0

# Directories to search for tests
testpaths =
    tests

# Test discovery patterns
python_files =
    test_*.py
    *_test.py
python_classes =
    Test*
python_functions =
    test_*

# Command line options
addopts =
    # Strict configuration
    --strict-markers
    --strict-config

    # Output options
    --verbose
    --tb=short
    --color=yes
    -ra

    # Coverage options
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

    # Performance options (uncomment to enable)
    # --numprocesses=auto
    # --dist=loadscope

# Test markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests
    edge: marks tests requiring edge AI dependencies
    cv: marks tests for computer vision modules
    ml: marks tests for machine learning modules
    nlp: marks tests for natural language processing modules
    api: marks tests for API modules
    tissue: marks tests for tissue/snippet functionality
    requires_gpu: marks tests that require GPU
    requires_internet: marks tests that require internet connection

# Warning filters
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignore specific warnings from third-party libraries
    ignore:.*numpy.*:DeprecationWarning
    ignore:.*sklearn.*:DeprecationWarning

# Asyncio mode (auto-detect async tests)
asyncio_mode = auto

# Logging options
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test collection settings
norecursedirs =
    .git
    .mypy_cache
    .pytest_cache
    .ruff_cache
    .venv
    venv
    __pycache__
    build
    dist
    *.egg-info
    htmlcov
    node_modules
    docs

# Console output settings
console_output_style = progress

# Timeout for tests (requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Doctest settings (uncomment to enable)
# doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# =============================================================================
# Custom Test Configuration
# =============================================================================

# Require minimum coverage per file
# [coverage:report]
# fail_under = 80
