# ConfigMap - Literal values
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  app.env: production
  log.level: info
  database.host: postgres.default.svc.cluster.local
  database.port: "5432"
  feature.flags: |
    {
      "newUI": true,
      "betaFeatures": false
    }
---
# ConfigMap - File content
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;

      sendfile on;
      keepalive_timeout 65;

      server {
        listen 80;
        server_name _;

        location / {
          proxy_pass http://backend:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
      }
    }
---
# Secret - Opaque type
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: default
type: Opaque
data:
  # Values must be base64 encoded
  username: cG9zdGdyZXM=  # postgres
  password: c2VjcmV0cGFzc3dvcmQ=  # secretpassword
  url: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnNlY3JldHBhc3N3b3JkQHBvc3RncmVzOjU0MzIvbXlkYg==
stringData:
  # Values in plain text (automatically encoded)
  connection-string: postgresql://postgres:secretpassword@postgres:5432/mydb
---
# Secret - TLS certificate
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: |
    LS0tLS1CRUdJTi...  # base64 encoded certificate
  tls.key: |
    LS0tLS1CRUdJTi...  # base64 encoded private key
---
