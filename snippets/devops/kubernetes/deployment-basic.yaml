# Kubernetes Deployment - Production-ready web application
# This deployment demonstrates best practices for running stateless applications

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: production
  labels:
    app: web-app
    environment: production
spec:
  # Run 3 replicas for high availability
  replicas: 3
  # Keep last 10 revisions for rollback capability
  revisionHistoryLimit: 10
  # Selector must match pod template labels
  selector:
    matchLabels:
      app: web-app
  # Rolling update strategy for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow 1 extra pod during update
      maxUnavailable: 0  # Keep all pods running during update
  # Pod template defines the pods this deployment creates
  template:
    metadata:
      labels:
        app: web-app
        version: v1.0.0  # Version label for canary deployments
      annotations:
        # Prometheus scraping configuration
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Use dedicated service account for RBAC
      serviceAccountName: web-app-sa
      # Security context for the pod
      securityContext:
        runAsNonRoot: true  # Don't run as root user
        runAsUser: 1000     # Run as user ID 1000
        fsGroup: 1000       # File system group ID
      containers:
      - name: web-app
        image: myregistry/web-app:1.0.0
        imagePullPolicy: IfNotPresent  # Use cached image if available
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        # Plain environment variable
        - name: ENVIRONMENT
          value: production
        # Sensitive data from Kubernetes Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: key
        # Resource limits and requests for scheduling
        resources:
          requests:  # Minimum guaranteed resources
            cpu: 100m      # 0.1 CPU cores
            memory: 128Mi  # 128 MiB RAM
          limits:    # Maximum allowed resources
            cpu: 500m      # 0.5 CPU cores
            memory: 512Mi  # 512 MiB RAM
        # Liveness probe - restart container if unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30  # Wait 30s after start
          periodSeconds: 10        # Check every 10s
          timeoutSeconds: 5        # Timeout after 5s
          failureThreshold: 3      # Restart after 3 failures
        # Readiness probe - remove from service if not ready
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10  # Check after 10s
          periodSeconds: 5         # Check every 5s
          timeoutSeconds: 3        # Timeout after 3s
          failureThreshold: 3      # Mark unready after 3 failures
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true  # Mount configuration as read-only
        - name: cache
          mountPath: /app/cache  # Writable cache directory
      # Volume definitions
      volumes:
      - name: config
        configMap:
          name: web-app-config  # Load from ConfigMap
      - name: cache
        emptyDir: {}  # Temporary directory, deleted with pod
