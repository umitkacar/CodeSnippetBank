# Telegraf Configuration
[global_tags]
  environment = "production"
  datacenter = "us-east-1"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Output to InfluxDB
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  skip_database_creation = false
  timeout = "5s"
  username = "telegraf"
  password = "secret"

# Output to Prometheus
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# System metrics
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.mem]]

[[inputs.net]]
  interfaces = ["eth0"]

[[inputs.processes]]

[[inputs.swap]]

[[inputs.system]]

# Docker metrics
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  source_tag = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice = true
  total = false
  docker_label_include = []
  docker_label_exclude = []

# Kubernetes metrics
[[inputs.kubernetes]]
  url = "https://$HOSTIP:10250"
  bearer_token = "/run/secrets/kubernetes.io/serviceaccount/token"
  insecure_skip_verify = true

# Nginx metrics
[[inputs.nginx]]
  urls = ["http://localhost/nginx_status"]

# PostgreSQL metrics
[[inputs.postgresql]]
  address = "host=postgres user=telegraf password=secret sslmode=disable dbname=postgres"
  databases = ["mydb"]

# Redis metrics
[[inputs.redis]]
  servers = ["tcp://redis:6379"]
  password = ""

# HTTP response metrics
[[inputs.http_response]]
  urls = [
    "http://myapp:8080/health",
    "http://api:3000/health"
  ]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = true

# Prometheus input
[[inputs.prometheus]]
  urls = ["http://localhost:9090/metrics"]
  metric_version = 2

# JMX (Java metrics)
[[inputs.jolokia2_agent]]
  urls = ["http://localhost:8080/jolokia"]
  name_prefix = "jmx_"

# StatsD input
[[inputs.statsd]]
  protocol = "udp"
  max_tcp_connections = 250
  tcp_keep_alive = false
  service_address = ":8125"
  delete_gauges = true
  delete_counters = true
  delete_sets = true
  delete_timings = true
  percentiles = [50.0, 90.0, 95.0, 99.0, 99.9, 99.95, 100.0]
  metric_separator = "_"
  parse_data_dog_tags = true
  datadog_extensions = true
  allowed_pending_messages = 10000
  percentile_limit = 1000

# Logs input
[[inputs.tail]]
  files = ["/var/log/nginx/access.log"]
  from_beginning = false
  data_format = "grok"
  grok_patterns = ['%{COMBINED_LOG_FORMAT}']

###############################################################################
#                            PROCESSOR PLUGINS                                #
###############################################################################

[[processors.enum]]
  [[processors.enum.mapping]]
    field = "status"
    dest = "status_code"
    [processors.enum.mapping.value_mappings]
      pass = 1
      fail = 2

[[processors.regex]]
  [[processors.regex.tags]]
    key = "path"
    pattern = "^/api/v[0-9]+/"
    replacement = "/api/"
