# AlertManager configuration
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'password'
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    # Critical alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 3h
      continue: true

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 12h

    # Database alerts
    - match_re:
        service: postgres|mysql|redis
      receiver: 'database-team'
      group_wait: 15s
      repeat_interval: 6h

    # Infrastructure alerts
    - match:
        team: infrastructure
      receiver: 'infra-team'

    # Application alerts by namespace
    - match:
        namespace: production
      receiver: 'production-team'
      routes:
        - match:
            severity: critical
          receiver: 'oncall'

    # Maintenance window - silence alerts
    - match:
        alertname: MaintenanceWindow
      receiver: 'null'

# Inhibition rules
inhibit_rules:
  # Inhibit warning if critical alert is firing
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']

  # Inhibit instance alerts if node is down
  - source_match:
      alertname: InstanceDown
    target_match_re:
      alertname: .*
    equal: ['instance']

  # Inhibit all alerts if cluster is down
  - source_match:
      alertname: ClusterDown
    target_match_re:
      alertname: .*
    equal: ['cluster']

# Receivers
receivers:
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#critical-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'
    pagerduty_configs:
      - service_key: 'your-pagerduty-service-key'
        description: '{{ .GroupLabels.alertname }}'
        details:
          severity: '{{ .CommonLabels.severity }}'
          description: '{{ .CommonAnnotations.description }}'
    email_configs:
      - to: 'oncall@example.com'
        subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.html" . }}'

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

  - name: 'database-team'
    slack_configs:
      - channel: '#database-alerts'
        send_resolved: true
    email_configs:
      - to: 'database-team@example.com'

  - name: 'infra-team'
    slack_configs:
      - channel: '#infrastructure'
        send_resolved: true
    email_configs:
      - to: 'infrastructure@example.com'

  - name: 'production-team'
    slack_configs:
      - channel: '#production-alerts'
        send_resolved: true

  - name: 'oncall'
    pagerduty_configs:
      - service_key: 'oncall-pagerduty-key'
        description: '{{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'https://hooks.example.com/alertmanager'
        send_resolved: true

  - name: 'null'
    # Null receiver for silencing alerts
