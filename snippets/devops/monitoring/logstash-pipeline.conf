# Logstash pipeline configuration
input {
  # Beats input
  beats {
    port => 5044
    ssl => true
    ssl_certificate => "/etc/pki/tls/certs/logstash.crt"
    ssl_key => "/etc/pki/tls/private/logstash.key"
  }

  # Syslog input
  tcp {
    port => 5000
    type => syslog
  }

  udp {
    port => 5000
    type => syslog
  }

  # HTTP input
  http {
    port => 8080
    codec => json
  }

  # Kafka input
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs"]
    group_id => "logstash"
    codec => json
  }
}

filter {
  # Parse syslog
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      add_field => [ "received_at", "%{@timestamp}" ]
      add_field => [ "received_from", "%{host}" ]
    }
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }

  # Parse Nginx access logs
  if [fields][type] == "nginx-access" {
    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{DATA:request} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:body_bytes_sent} "%{DATA:http_referer}" "%{DATA:http_user_agent}"'
      }
    }
    date {
      match => [ "time_local", "dd/MMM/yyyy:HH:mm:ss Z" ]
      remove_field => [ "time_local" ]
    }
    mutate {
      convert => {
        "status" => "integer"
        "body_bytes_sent" => "integer"
      }
    }
    geoip {
      source => "remote_addr"
      target => "geoip"
    }
    useragent {
      source => "http_user_agent"
      target => "user_agent"
    }
  }

  # Parse JSON application logs
  if [fields][type] == "application" {
    json {
      source => "message"
      target => "app"
    }
    mutate {
      rename => {
        "[app][level]" => "log_level"
        "[app][timestamp]" => "log_timestamp"
        "[app][message]" => "log_message"
        "[app][trace_id]" => "trace_id"
      }
    }
    date {
      match => [ "log_timestamp", "ISO8601" ]
      remove_field => [ "log_timestamp" ]
    }
  }

  # Parse Kubernetes metadata
  if [kubernetes] {
    mutate {
      rename => {
        "[kubernetes][pod][name]" => "k8s_pod"
        "[kubernetes][namespace]" => "k8s_namespace"
        "[kubernetes][container][name]" => "k8s_container"
        "[kubernetes][node][name]" => "k8s_node"
      }
    }
  }

  # Add common fields
  mutate {
    add_field => {
      "[@metadata][target_index]" => "logstash-%{+YYYY.MM.dd}"
    }
  }

  # Drop empty messages
  if [message] =~ /^\s*$/ {
    drop { }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "agent", "ecs", "host", "input" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "changeme"
    index => "%{[@metadata][target_index]}"
    document_type => "_doc"
    template_name => "logstash"
    template_overwrite => true
    manage_template => true
  }

  # Output to S3 (archival)
  s3 {
    access_key_id => "${AWS_ACCESS_KEY_ID}"
    secret_access_key => "${AWS_SECRET_ACCESS_KEY}"
    region => "us-east-1"
    bucket => "logs-archive"
    size_file => 50
    time_file => 15
    codec => "json_lines"
    prefix => "logs/%{+YYYY}/%{+MM}/%{+dd}/"
  }

  # Output to stdout (debugging)
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }

  # Dead letter queue for failed events
  if "_grokparsefailure" in [tags] {
    file {
      path => "/var/log/logstash/failed_events_%{+yyyy_MM_dd}.log"
      codec => "json_lines"
    }
  }
}
