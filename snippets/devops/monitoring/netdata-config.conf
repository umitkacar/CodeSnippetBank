# Netdata configuration
[global]
    run as user = netdata
    web files owner = root
    web files group = root
    history = 3600
    update every = 1
    memory mode = dbengine
    page cache size = 32
    dbengine multihost disk space = 256

[web]
    web files owner = root
    web files group = root
    bind to = *
    default port = 19999
    allow connections from = localhost *
    allow dashboard from = localhost *
    allow badges from = *
    allow management from = localhost

[plugins]
    enable running new plugins = yes
    check for new plugins every = 60
    python.d = yes
    node.d = yes
    go.d = yes
    charts.d = yes
    apps = yes
    cgroups = yes
    disk = yes
    tc = no

[plugin:proc]
    /proc/net/dev = yes
    /proc/diskstats = yes
    /proc/net/netstat = yes
    /proc/net/snmp = yes
    /proc/net/snmp6 = yes
    /proc/net/sctp/snmp = yes
    /proc/net/softnet_stat = yes
    /proc/net/ip_vs/stats = yes
    /proc/stat = yes
    /proc/uptime = yes
    /proc/loadavg = yes
    /proc/sys/kernel/random/entropy_avail = yes
    /proc/pressure = yes
    /proc/vmstat = yes

[plugin:tc]
    script to run to get tc values = /usr/libexec/netdata/plugins.d/tc-qos-helper.sh

# Health checks
[health]
    enabled = yes
    default repeat warning = never
    default repeat critical = never

# Backend configuration - Send metrics to other time-series databases
[backend]
    enabled = no
    type = prometheus
    destination = localhost:9090
    data source = average
    prefix = netdata
    hostname = my-hostname
    update every = 10
    buffer on failures = 10
    timeout ms = 20000
    send charts matching = *
    send hosts matching = localhost *

# Streaming configuration
[stream]
    enabled = no
    destination = tcp:stream.example.com:19999
    api key = YOUR-API-KEY-HERE
    timeout seconds = 60
    default port = 19999
    send charts matching = *
    buffer size bytes = 1048576
    reconnect delay seconds = 5
    initial clock resync iterations = 60
