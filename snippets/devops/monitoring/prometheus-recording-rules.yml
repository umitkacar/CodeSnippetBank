# Prometheus recording rules for performance optimization
groups:
  - name: cpu_rules
    interval: 30s
    rules:
      - record: node:cpu:avg_rate5m
        expr: avg by(instance) (rate(node_cpu_seconds_total{mode!="idle"}[5m]))

      - record: node:cpu:usage_percentage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

  - name: memory_rules
    interval: 30s
    rules:
      - record: node:memory:available_bytes
        expr: node_memory_MemAvailable_bytes

      - record: node:memory:usage_percentage
        expr: |
          100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))

      - record: node:memory:used_bytes
        expr: node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes

  - name: disk_rules
    interval: 30s
    rules:
      - record: node:disk:usage_percentage
        expr: |
          100 * (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}))

      - record: node:disk:io_time_seconds_rate
        expr: rate(node_disk_io_time_seconds_total[5m])

      - record: node:disk:read_bytes_rate
        expr: rate(node_disk_read_bytes_total[5m])

      - record: node:disk:write_bytes_rate
        expr: rate(node_disk_written_bytes_total[5m])

  - name: network_rules
    interval: 30s
    rules:
      - record: node:network:receive_bytes_rate
        expr: rate(node_network_receive_bytes_total{device!="lo"}[5m])

      - record: node:network:transmit_bytes_rate
        expr: rate(node_network_transmit_bytes_total{device!="lo"}[5m])

      - record: node:network:errors_rate
        expr: |
          rate(node_network_receive_errs_total[5m]) +
          rate(node_network_transmit_errs_total[5m])

  - name: kubernetes_rules
    interval: 30s
    rules:
      - record: namespace:container_cpu_usage:sum
        expr: sum by(namespace) (rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m]))

      - record: namespace:container_memory_usage:sum
        expr: sum by(namespace) (container_memory_working_set_bytes{container!="POD",container!=""})

      - record: pod:container_cpu_usage:sum
        expr: sum by(namespace, pod) (rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m]))

      - record: pod:container_memory_usage:sum
        expr: sum by(namespace, pod) (container_memory_working_set_bytes{container!="POD",container!=""})

  - name: application_rules
    interval: 30s
    rules:
      - record: http:request_rate_5m
        expr: rate(http_requests_total[5m])

      - record: http:error_rate_5m
        expr: rate(http_requests_total{status=~"5.."}[5m])

      - record: http:success_rate_5m
        expr: rate(http_requests_total{status=~"2.."}[5m])

      - record: http:request_duration_95th_percentile
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))

      - record: http:request_duration_99th_percentile
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))

  - name: database_rules
    interval: 30s
    rules:
      - record: postgres:connections:active
        expr: sum by(instance) (pg_stat_activity_count{state="active"})

      - record: postgres:connections:idle
        expr: sum by(instance) (pg_stat_activity_count{state="idle"})

      - record: postgres:queries:rate
        expr: rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m])

      - record: redis:commands:rate
        expr: rate(redis_commands_processed_total[5m])

      - record: redis:memory:usage_percentage
        expr: 100 * (redis_memory_used_bytes / redis_memory_max_bytes)
