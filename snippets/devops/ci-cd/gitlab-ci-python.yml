image: python:3.11

stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -V
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate

# Code quality and linting
lint:black:
  stage: lint
  script:
    - pip install black
    - black --check .

lint:flake8:
  stage: lint
  script:
    - pip install flake8
    - flake8 .

lint:pylint:
  stage: lint
  script:
    - pip install pylint
    - pylint **/*.py
  allow_failure: true

typecheck:
  stage: lint
  script:
    - pip install mypy
    - mypy .
  allow_failure: true

# Testing
test:unit:
  stage: test
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/testdb
    REDIS_URL: redis://redis:6379
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-xdist
    - pytest --cov=. --cov-report=xml --cov-report=html -n auto
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 30 days

# Security scanning
security:safety:
  stage: security
  script:
    - pip install safety
    - safety check --json
  allow_failure: true

security:bandit:
  stage: security
  script:
    - pip install bandit
    - bandit -r . -f json -o bandit-report.json
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 30 days
  allow_failure: true

# Build package
build:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - tags

# Deploy to PyPI
deploy:pypi:
  stage: deploy
  script:
    - pip install twine
    - twine upload dist/*
  only:
    - tags
  when: manual

# Deploy with Docker
deploy:docker:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  only:
    - main
