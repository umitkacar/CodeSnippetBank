version: 2.1

orbs:
  node: circleci/node@5.1
  docker: circleci/docker@2.4
  kubernetes: circleci/kubernetes@1.3

executors:
  node-executor:
    docker:
      - image: cimg/node:20.9
    resource_class: medium

jobs:
  install:
    executor: node-executor
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run linter
          command: npm run lint

  test:
    executor: node-executor
    docker:
      - image: cimg/node:20.9
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
      - image: cimg/redis:7.2
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Run tests
          command: npm test -- --coverage
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
      - run:
          name: Upload coverage
          command: |
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            ./codecov

  build:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build application
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  docker-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: .
      - docker/check
      - docker/build:
          image: myorg/myapp
          tag: ${CIRCLE_SHA1:0:7},latest
      - docker/push:
          image: myorg/myapp
          tag: ${CIRCLE_SHA1:0:7},latest

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - kubernetes/install-kubectl
      - run:
          name: Deploy to Kubernetes
          command: |
            echo $KUBE_CONFIG | base64 -d > kubeconfig
            export KUBECONFIG=./kubeconfig
            kubectl set image deployment/myapp \
              myapp=myorg/myapp:${CIRCLE_SHA1:0:7} \
              -n production
            kubectl rollout status deployment/myapp -n production

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - lint
            - test
      - docker-build:
          requires:
            - build
          filters:
            branches:
              only: main
      - hold-deploy:
          type: approval
          requires:
            - docker-build
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - hold-deploy
          filters:
            branches:
              only: main

  nightly:
    triggers:
      - schedule:
          cron: "0 2 * * *"
          filters:
            branches:
              only: main
    jobs:
      - install
      - test:
          requires:
            - install
